name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck model modules
        run: deno task check

      - name: Test suite
        run: deno task test
