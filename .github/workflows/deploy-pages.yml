name: Deploy GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Share the group with release.yml; never cancel an in-flight release Pages deploy.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    # release.yml owns Pages when `deno task release` pushes main + tag together.
    # head_commit is often null on merge/push webhooks — treat that as a normal main deploy.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.head_commit == null ||
      !startsWith(github.event.head_commit.message, 'chore: release')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build demo app
        run: deno task build:demo

      - name: Build TAAAT
        run: deno task build:taaat

      - name: Preserve frozen release versions on GitHub Pages
        run: deno run -A scripts/assemble-pages.ts main docs dist-pages

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
